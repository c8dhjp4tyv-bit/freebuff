name: Verify recreated PR merges

on:
  push:
    branches:
      - tmp-noop

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Address remaining maintainer feedback
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "c8dhjp4tyv-bit"
          git config user.email "c8dhjp4tyv@privaterelay.appleid.com"
          checkout_branch() { git fetch origin "$1"; git checkout -B "$1" "origin/$1"; }

          checkout_branch recreate/1108-ctrl-arrow-word-navigation
          bun test cli/src/utils/__tests__/word-navigation.test.ts

          checkout_branch recreate/1104-account-switching
          grep -F "open a fresh shell/session" README.md

          checkout_branch recreate/1102-freebuff-chat-logo-sheen
          bun test cli/src/utils/__tests__/chat-header-animation.test.ts

          checkout_branch recreate/1101-freebuff-commit-attribution
          python3 - <<'PY'
          from pathlib import Path
          p=Path('common/src/tools/params/tool/run-terminal-command.ts')
          s=p.read_text()
          old="""export const getGitCommitGuidePrompt = (\n  isFreebuff = isFreebuffBuild,\n): string => {\n  const { productName, productDomain } = getCommitAttribution(isFreebuff)\n"""
          new="""export const getGitCommitGuidePrompt = (\n  isFreebuff?: boolean,\n): string => {\n  const { productName, productDomain } =\n    isFreebuff === undefined\n      ? buildCommitAttribution\n      : getCommitAttribution(isFreebuff)\n"""
          if old not in s: raise SystemExit('1185 block not found')
          p.write_text(s.replace(old,new,1))
          PY
          bun test common/src/tools/params/tool/__tests__/run-terminal-command-branding.test.ts
          git diff --check
          git add common/src/tools/params/tool/run-terminal-command.ts
          if ! git diff --cached --quiet; then git commit -m "refactor(common): reuse build commit attribution"; git push origin HEAD:recreate/1101-freebuff-commit-attribution; fi

          checkout_branch recreate/1099-cli-logger-startup-resilience
          grep -n "export const CHAT_LOG_FILENAME" cli/src/utils/logger.ts
          bun test cli/src/utils/__tests__/logger.test.ts

          checkout_branch recreate/1096-deepseek-beijing-weekend-boundary
          bun test common/src/__tests__/freebuff-peak-hours.test.ts

          checkout_branch recreate/1098-sdk-list-directory-path-boundary
          bun test sdk/src/__tests__/list-directory.test.ts

          checkout_branch recreate/1103-btw-command
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cli/src/commands/__tests__/command-args.test.ts')
          s=p.read_text()
          old="""      const addToQueue = mock(() => {})\n      const sendMessage = mock(async () => {})\n      const setInputFocused = mock(() => {})\n      const params = createMockParams({\n        inputValue: '/btw remember the edge case',\n        isStreaming: true,\n        addToQueue,\n        sendMessage,\n        setInputFocused,\n      })\n\n      btwCmd!.handler(params, 'remember the edge case')\n\n      expect(addToQueue).toHaveBeenCalledWith(\n        expect.stringContaining('remember the edge case'),\n        [attachment],\n      )\n      expect(sendMessage).not.toHaveBeenCalled()\n      expect(setInputFocused).toHaveBeenCalledWith(true)\n      expect(useChatStore.getState().pendingAttachments).toEqual([])\n"""
          new="""      const addToQueue = mock(() => {})\n      const sendMessage = mock(async () => {})\n      const setInputFocused = mock(() => {})\n      const saveToHistory = mock(() => {})\n      const focus = mock(() => {})\n      const params = createMockParams({\n        inputRef: { current: { focus } } as RouterParams['inputRef'],\n        inputValue: '/btw remember the edge case',\n        isStreaming: true,\n        addToQueue,\n        saveToHistory,\n        sendMessage,\n        setInputFocused,\n      })\n\n      btwCmd!.handler(params, 'remember the edge case')\n\n      expect(addToQueue).toHaveBeenCalledWith(\n        expect.stringContaining('remember the edge case'),\n        [attachment],\n      )\n      expect(sendMessage).not.toHaveBeenCalled()\n      expect(saveToHistory).toHaveBeenCalledWith('/btw remember the edge case')\n      expect(setInputFocused).toHaveBeenCalledWith(true)\n      expect(focus).toHaveBeenCalledTimes(1)\n      expect(useChatStore.getState().pendingAttachments).toEqual([])\n"""
          if old not in s: raise SystemExit('1189 block not found')
          p.write_text(s.replace(old,new,1))
          PY
          bun test cli/src/commands/__tests__/command-args.test.ts cli/src/commands/__tests__/btw-attachments.test.ts cli/src/commands/__tests__/prompt-builders.test.ts
          git diff --check
          git add cli/src/commands/__tests__/command-args.test.ts
          if ! git diff --cached --quiet; then git commit -m "test(cli): cover btw focus and history handoff"; git push origin HEAD:recreate/1103-btw-command; fi

          checkout_branch recreate/1109-cli-typecheck-dependencies
          echo '--- tar direct usage'; grep -R -n -E "from ['\"]tar['\"]|require\(['\"]tar['\"]\)" cli --exclude-dir=node_modules || true
          echo '--- react-dom/server usage'; grep -R -n "react-dom/server" cli --exclude-dir=node_modules || true
          for f in cli/release/package.json cli/release-staging/package.json freebuff/cli/release/package.json; do if [ -f "$f" ]; then echo "--- $f"; grep -n '"tar"' "$f" || true; fi; done
          bun run --cwd cli typecheck
          git diff --check
